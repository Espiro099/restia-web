# Panel web de Restia en Render, ambiente de PRUEBAS (sitio estático, plan gratuito).
#
# El panel habla con la API como si fuera el mismo sitio: Render reenvía /api, /sanctum y /contrasena a
# restia-api-staging. Así la cookie de sesión y el token CSRF son del mismo origen, igual que con el proxy de
# Vite en desarrollo; con dominios distintos de onrender.com el navegador no mandaría la cookie.
#
# Las cabeceras de seguridad son las de security-headers.js (la prueba de tests/security.test.js lo revisa).
services:
  - type: web
    name: restia-web-staging
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self), payment=()
    routes:
      # Primero lo que va a la API; al final, cualquier ruta del panel (/panel/..., /m) sirve index.html.
      - type: rewrite
        source: /api/*
        destination: https://restia-api-staging.onrender.com/api/*
      - type: rewrite
        source: /sanctum/*
        destination: https://restia-api-staging.onrender.com/sanctum/*
      - type: rewrite
        source: /contrasena
        destination: https://restia-api-staging.onrender.com/contrasena
      - type: rewrite
        source: /*
        destination: /index.html
