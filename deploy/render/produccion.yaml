# Producción del sitio de La Mesa y del panel de Restia en Render (restia-api/docs/Despliegue_Produccion.md).
# Plantilla: al crear el Blueprint, en "Blueprint Path" se indica deploy/render/produccion.yaml. Staging sigue en
# el render.yaml de la raíz.
#
# Un solo sitio estático sirve el sitio público (/), el panel (/panel), el acceso (/acceso) y el menú del QR
# (/m). /api, /sanctum y /contrasena se reenvían a la API de producción (servicio restia-api), así que la cookie
# de sesión y el token CSRF son del mismo origen. El dominio propio se agrega en Render (Settings → Custom
# Domains) y en el DNS; no hace falta cambiar este archivo.
#
# Las cabeceras de seguridad son las de security-headers.js (tests/security.test.js revisa este archivo).
services:
  - type: web
    name: restia-web
    runtime: static
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self), payment=()
      # Solo HTTPS en el dominio propio y sus subdominios, por un año.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      # Primero lo que va a la API; al final, cualquier otra ruta sirve index.html (el enrutador de Vue).
      # Si el servicio de la API quedó con otro nombre, cambia restia-api.onrender.com por su dirección.
      - type: rewrite
        source: /api/*
        destination: https://restia-api.onrender.com/api/*
      - type: rewrite
        source: /sanctum/*
        destination: https://restia-api.onrender.com/sanctum/*
      - type: rewrite
        source: /contrasena
        destination: https://restia-api.onrender.com/contrasena
      - type: rewrite
        source: /*
        destination: /index.html
